name: Enterprise Terraform CI/CD (OPA + Checkov + HCP Terraform)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TF_CLOUD_ORGANIZATION: balu-hcl-tf-org
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

jobs:
  fmt-validate-security-scan:
    name: Format, Validate, Checkov & OPA Policy Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate (Dev)
        run: |
          terraform -chdir=environments/dev init -input=false
          terraform -chdir=environments/dev validate

      - name: Setup Python & Run Checkov IaC Scan
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Checkov on Terraform Code
        run: |
          pip install --quiet checkov
          checkov -d . --config-file .checkov.yaml

      - name: Setup OPA & Verify Policies
        run: |
          curl -sSL -o opa https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa check policies/
